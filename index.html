<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدير المصاريف</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
}

input{
    width:90%;
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    background:#22c55e;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.result{
    font-size:24px;
    font-weight:bold;
}

.positive{
    color:#22c55e;
}

.negative{
    color:#ef4444;
}
</style>
</head>
<body>

<div class="container">

<h1>💰 مدير المصاريف الشهرية</h1>

<div class="card">
<h3>💵 الراتب الشهري</h3>
<input type="number" id="salary" placeholder="اكتب راتبك">
</div>

<div class="card">
<h3>🚗 قسط السيارة</h3>
<input type="number" id="car">
</div>

<div class="card">
<h3>🏠 إيجار المنزل</h3>
<input type="number" id="rent">
</div>

<div class="card">
<h3>🛒 طلبات البيت من السوبر ماركت</h3>
<input type="number" id="market">
</div>

<div class="card">
<h3>💳 الديون</h3>
<input type="number" id="debt">
</div>

<div class="card">
<h3>📱 أقساط تمارا</h3>
<input type="number" id="tamara">
</div>

<div class="card">
<h3>🛍 أقساط تابي</h3>
<input type="number" id="tabby">
</div>

<div class="card">
<h3>⛽ البنزين</h3>
<input type="number" id="fuel">
</div>

<div class="card">
<h3>🏥 الصحة</h3>
<input type="number" id="health">
</div>

<div class="card">
<h3>🎮 الترفيه</h3>
<input type="number" id="fun">
</div>

<button onclick="calculate()">
احسب
</button>

<div class="card">
<h2>إجمالي المصاريف</h2>
<h1 id="expenses">0</h1>
</div>

<div class="card">
<h2>المتبقي</h2>
<h1 id="remaining" class="result">0</h1>
</div>

</div>

<script>
function calculate(){

let salary =
Number(document.getElementById("salary").value) || 0;

let car =
Number(document.getElementById("car").value) || 0;

let rent =
Number(document.getElementById("rent").value) || 0;

let market =
Number(document.getElementById("market").value) || 0;

let debt =
Number(document.getElementById("debt").value) || 0;

let tamara =
Number(document.getElementById("tamara").value) || 0;

let tabby =
Number(document.getElementById("tabby").value) || 0;

let fuel =
Number(document.getElementById("fuel").value) || 0;

let health =
Number(document.getElementById("health").value) || 0;

let fun =
Number(document.getElementById("fun").value) || 0;

let expenses =
car + rent + market + debt + tamara + tabby + fuel + health + fun;

let remaining =
salary - expenses;

document.getElementById("expenses").innerText =
expenses + " ريال";

let result =
document.getElementById("remaining");

if(remaining >= 0){

result.className = "result positive";

result.innerHTML =
"✅ باقي معك " + remaining + " ريال";

}else{

result.className = "result negative";

result.innerHTML =
"❌ تحتاج " + Math.abs(remaining) + " ريال";

}

localStorage.setItem("salary",salary);
localStorage.setItem("car",car);
localStorage.setItem("rent",rent);
localStorage.setItem("market",market);
localStorage.setItem("debt",debt);
localStorage.setItem("tamara",tamara);
localStorage.setItem("tabby",tabby);
localStorage.setItem("fuel",fuel);
localStorage.setItem("health",health);
localStorage.setItem("fun",fun);

}

window.onload = function(){

[
"salary",
"car",
"rent",
"market",
"debt",
"tamara",
"tabby",
"fuel",
"health",
"fun"
].forEach(id=>{

document.getElementById(id).value =
localStorage.getItem(id) || "";

});

calculate();

}
</script>

</body>
</html>
